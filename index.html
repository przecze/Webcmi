<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hex Battle</title>
  <style>
    body { margin: 0; background: #1a1410; color: #e8d9a8; font: 14px Georgia, serif;
           display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 16px; }
    canvas { border: 3px solid #8b6b2e; max-width: 100%; height: auto !important; }
    .bar { display: flex; gap: 12px; align-items: center; }
    button { background: #3a2a14; color: #e8d9a8; border: 1px solid #8b6b2e; padding: 4px 12px;
             font: inherit; cursor: pointer; }
    button:hover { background: #4d3a1d; }
  </style>
</head>
<body>
  <canvas id="board"></canvas>
  <div class="bar">
    <span id="status"></span>
    <button id="wait">Wait</button>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
